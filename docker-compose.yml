services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    ports:
      - 9000
      - 9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  kbms:
    image: ghcr.io/kyundae-kim/docmesh-kbms-api:v0.1.0
    expose:
      - "8000"
    environment:
      KBMS_USER_ID: kbms
      KBMS_DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      KBMS_MINIO_ENDPOINT: minio:9000
      KBMS_MINIO_ACCESS_KEY: minioadmin
      KBMS_MINIO_SECRET_KEY: minioadmin123
      KBMS_MINIO_BUCKET: kbms-documents
      KBMS_MINIO_SECURE: "false"
      KBMS_OLLAMA_ENDPOINT: http://192.168.219.106:11434
      KBMS_OLLAMA_MODEL: bge-m3
      KBMS_MILVUS_URI: ./data/milvus.db
      KBMS_COLLECTION_NAME: kbms_documents
      KBMS_VECTOR_DIMENSION: 1024
      KBMS_CHUNK_SIZE: 1000
      KBMS_CHUNK_OVERLAP: 100
    volumes:
      - kbms-data:/app/data
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      KBMS_API_URL: http://kbms:8000
    ports:
      - 3001
    restart: unless-stopped
    depends_on:
      kbms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  minio-data:
  kbms-data:
